[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obscuralens"
version = "6.3.0"
description = "Multi-source OSINT console and investigation platform for 20 target kinds with a built-in web UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MJH" }]
keywords = ["osint", "security", "reconnaissance", "ip", "email", "username", "domain"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet",
]
dependencies = [
    "requests>=2.28.0",
    "phonenumbers>=8.13.0",
    "PyYAML>=6.0",
    "tabulate>=0.9.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.6.0",
    "numpy>=1.23.0",
    "wordcloud>=1.8.0",
    # reportlab 5.1.0 raises ImportError on Python 3.9 (it bumped its
    # internal __min_python_version__ to 3.10) while its packaging
    # metadata still advertises requires_python>=3.9, so pip installs
    # it on 3.9 and every PDF path then reports "not installed".
    # Cap it there until the floor rises past 3.9.
    "reportlab>=3.6.0,<5.1.0; python_version < '3.10'",
    "reportlab>=3.6.0; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "build>=1.0",
    "twine>=5.0",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
tui = [
    "textual>=0.60",
]
exe = [
    # The standalone executable must be fully self-contained: a frozen app
    # cannot pip-install extras at runtime, so the web UI and TUI stacks
    # ship inside the bundle (see scripts/obscuralens.spec).
    "pyinstaller>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "textual>=0.60",
    "python-multipart>=0.0.9",
]
desktop = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
obscuralens = "obscuralens.cli:main"
obscuralens-desktop = "obscuralens.desktop.launcher:main"

[project.urls]
Homepage = "https://github.com/AceGuru-mjh/obscuralens"
Repository = "https://github.com/AceGuru-mjh/obscuralens"

[tool.setuptools.packages.find]
include = ["obscuralens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration' -q"
markers = [
    "integration: tests that hit real network services (run with -m integration)",
]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.setuptools.package-data]
obscuralens = [
    "data/*.txt",
    "rules/packs/*.yaml",
    "reporting/templates/*.j2",
    "web/static/index.html",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "web/static/js/views/*.js",
]
