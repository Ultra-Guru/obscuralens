name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (E, F, W, I, B, C4, SIM)
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Unit tests (no network)
        run: pytest -m "not integration"

  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Byte-compile all sources
        run: python -m compileall -q obscuralens tests scripts
      - name: Import smoke test
        run: |
          python -c "import obscuralens, obscuralens.commands, obscuralens.cli, obscuralens.investigate, obscuralens.watchlist, obscuralens.plugins, obscuralens.mcp_server"
          python -m obscuralens --version
      - name: Dependency consistency
        run: pip check
      - name: Username platform registry integrity
        # Offline: validates the 112 hand-maintained platform entries and the
        # tables keyed by platform name. Fails on a duplicate registration, a
        # URL with no placeholder, an API spec missing a callable, or an
        # extractor orphaned by a rename. Makes no network requests.
        run: python -m obscuralens sources check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with web extra
        run: pip install -e ".[dev,web]"
      - name: Web API tests
        run: pytest tests/test_web.py

  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with tui extra
        run: pip install -e ".[dev,tui]"
      - name: TUI tests
        run: pytest tests/test_tui.py

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Benchmark suite smoke (quick mode, committed baseline)
        run: python -m benchmarks.run --quick
      - name: Benchmark contract tests
        run: pytest tests/test_benchmarks.py -q

  sdk-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: TypeScript SDK + browser client tests (node:test, offline)
        run: |
          node --test sdk-js/test/client.test.mjs sdk-js/test/session.test.mjs sdk-js/test/errors.test.mjs
          node --test tests/js/web-api.test.mjs tests/js/web-sse.test.mjs tests/js/web-main.test.mjs

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    # Focused check for the v5.1 desktop beta surface: the desktop module,
    # i18n catalogues, offline data packs, SDK and rule packs. These are all
    # stdlib(+yaml/jinja2) modules, so the plain dev install suffices.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Desktop beta surface tests
        run: |
          pytest tests/test_desktop.py tests/test_i18n.py tests/test_data_catalog.py \
                 tests/test_sdk.py tests/test_rules.py tests/test_templates.py -q
      - name: Desktop CLI smoke test
        run: |
          python -m obscuralens desktop --diagnostics | head -40
          python -m obscuralens data country US
          python -m obscuralens data port 22
          python -m obscuralens i18n list
          python -m obscuralens data stats

  exe:
    # Best-effort standalone Windows executable; the artifact is uploaded even
    # if a future PyInstaller/hook regression breaks the build.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with exe extra
        run: pip install ".[exe]"
      - name: Build single-file executable
        run: pyinstaller scripts/obscuralens.spec --noconfirm
      - name: Smoke-test the executable
        run: dist/obscuralens.exe --version
      - name: Boot-test the frozen web UI
        # A frozen app cannot pip-install extras at runtime, so the bundled
        # web stack must actually start: boot `serve`, poll /api/health,
        # then stop the server again. Exe output is captured so even a
        # silent early exit leaves evidence in the log.
        shell: pwsh
        run: |
          $log = 'frozen-serve.log'
          $proc = Start-Process -FilePath dist/obscuralens.exe `
            -ArgumentList 'serve', '--port', '18080' `
            -RedirectStandardOutput $log `
            -RedirectStandardError "$log.err" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 75 -and -not $proc.HasExited; $i++) {
              try {
                $r = Invoke-RestMethod http://127.0.0.1:18080/api/health `
                  -TimeoutSec 5
                if ($r.status -eq 'ok') { $ok = $true; break }
              } catch { Start-Sleep 4 }
            }
            if (-not $ok) {
              if ($proc.HasExited) {
                Write-Output ("frozen exe exited early with code {0}" `
                  -f $proc.ExitCode)
              } else {
                Write-Output 'frozen exe still alive but never answered'
              }
              Write-Output '--- frozen-serve.log tail ---'
              Get-Content $log -Tail 60 -ErrorAction SilentlyContinue
              Get-Content "$log.err" -Tail 60 -ErrorAction SilentlyContinue
              throw 'frozen web UI did not answer /api/health'
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscuralens-windows-exe
          path: dist/obscuralens.exe

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate package metadata
        run: twine check dist/*
      - name: Install the wheel and smoke-test the CLI
        run: |
          pip install dist/*.whl
          obscuralens --version
          obscuralens plugins list
          obscuralens sources domain
